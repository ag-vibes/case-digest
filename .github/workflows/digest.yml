name: Case Digest manual check

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Safe run mode
        required: true
        default: check
        type: choice
        options:
          - check
          - dry-run
      include_telegram:
        description: Read public Telegram sources
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  case-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install --requirement requirements.txt

      - name: Run safe mode
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          SESSION_STRING: ${{ secrets.SESSION_STRING }}
        run: >-
          python digest.py
          --mode "${{ inputs.mode }}"
          ${{ inputs.include_telegram == false && '--without-telegram' || '' }}

      - name: Summarize dry-run
        if: ${{ inputs.mode == 'dry-run' }}
        run: |
          echo "### Case Digest dry-run" >> "$GITHUB_STEP_SUMMARY"
          echo "No Telegram messages were published." >> "$GITHUB_STEP_SUMMARY"
          sed -n '1,200p' artifacts/preview.md >> "$GITHUB_STEP_SUMMARY"
